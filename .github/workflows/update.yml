name: Daily update

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m arxivdb harvest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: harvest-logs
          path: logs/
          retention-days: 30
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then exit 0; fi
          datestamp=$(python3 -c 'import json; print(json.load(open("data/state.json"))["datestamp"])')
          git commit -m "Add arXiv records changed through $datestamp"
          git push
